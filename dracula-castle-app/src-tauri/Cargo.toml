[package]
name = "dracula_castle_app"
version = "0.1.0"
description = "Dracula's Castle - Interactive Window Clicker"
authors = ["You"]
edition = "2021"

[lib]
name = "dracula_castle_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
tauri = { version = "2.10.0", features = ["protocol-asset"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
