[package]
name = "colorwizard_desktop"
version = "0.1.0"
description = "ColorWizard Desktop"
authors = ["ColorWizard"]
edition = "2021"

[lib]
name = "colorwizard_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.10.0", features = [] }
rfd = "0.15"
